<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Alan Tan — Software Engineering Student</title>
  <desc id="desc">A light editorial banner introducing Alan Tan as a builder of full-stack, mobile, AI, user experience, and game projects.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d8dee4" stroke-width="1" opacity="0.6"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b00"/>
      <stop offset="0.5" stop-color="#4f73b9"/>
      <stop offset="1" stop-color="#0aa39a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1f2328" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="#f6f8fa"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <rect x="0" y="0" width="14" height="360" rx="7" fill="url(#accent)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="72" y="72" fill="#57606a" font-size="16" font-weight="700" letter-spacing="4">CREATIVE ENGINEER · PRODUCT BUILDER</text>
    <text x="68" y="156" fill="#1f2328" font-size="72" font-weight="800" letter-spacing="-2">ALAN TAN</text>
    <text x="72" y="204" fill="#57606a" font-size="23" font-weight="500">Turning practical problems into thoughtful digital products.</text>

    <g transform="translate(72 246)">
      <rect width="142" height="40" rx="20" fill="#fff1e8" stroke="#ff6b00"/>
      <text x="71" y="26" text-anchor="middle" fill="#b54708" font-size="14" font-weight="700">FULL-STACK</text>
      <rect x="154" width="136" height="40" rx="20" fill="#eef4ff" stroke="#4f73b9"/>
      <text x="222" y="26" text-anchor="middle" fill="#315a9f" font-size="14" font-weight="700">AI + MOBILE</text>
      <rect x="302" width="144" height="40" rx="20" fill="#e8f8f6" stroke="#0aa39a"/>
      <text x="374" y="26" text-anchor="middle" fill="#087f78" font-size="14" font-weight="700">GAME + UX</text>
    </g>

    <g transform="translate(760 48)" filter="url(#shadow)">
      <rect width="370" height="264" rx="24" fill="#ffffff" stroke="#d0d7de"/>
      <circle cx="28" cy="27" r="5" fill="#ff6b00"/>
      <circle cx="46" cy="27" r="5" fill="#4f73b9"/>
      <circle cx="64" cy="27" r="5" fill="#0aa39a"/>
      <text x="28" y="75" fill="#57606a" font-size="13" font-weight="700" letter-spacing="2">CURRENTLY BUILDING</text>
      <text x="28" y="116" fill="#1f2328" font-size="30" font-weight="800">PLANOVA</text>
      <text x="28" y="145" fill="#57606a" font-size="16">Adaptive study planning with</text>
      <text x="28" y="169" fill="#57606a" font-size="16">machine learning + optimization.</text>
      <rect x="28" y="205" width="314" height="2" rx="1" fill="url(#accent)"/>
      <text x="28" y="235" fill="#57606a" font-size="13" font-weight="600">FLUTTER · FIREBASE · PYTHON · LIGHTGBM</text>
    </g>
  </g>
</svg>
